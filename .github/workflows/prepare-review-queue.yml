name: Prepare 100-article evidence review queue

on:
  push:
    branches: [main]
    paths: ['prepare_review_queue.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "feedparser==6.0.11" "requests>=2.31,<3" "openai>=1.40,<3" "trafilatura>=2,<3"
      - name: Stage 100 candidates, without publishing them
        run: python prepare_review_queue.py --limit 100 --apply
      - name: Commit review queue
        run: |
          git config user.name "map-bot"
          git config user.email "map-bot@users.noreply.github.com"
          git add review_queue_100.json
          if ! git diff --cached --quiet; then
            git commit -m "Stage 100 pending articles for evidence review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
